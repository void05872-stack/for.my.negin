<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070c22">
<title>یه پیام برای نگین</title>
<style>
  :root{
    --night:#070c22;
    --dusk:#16275a;
    --dusk2:#1d3170;
    --moon:#eef2ff;
    --mist:#9fb0e6;
    --amber:#f2b35e;
    --rose:#ff9fb5;
    --font:system-ui,-apple-system,"Segoe UI","Geeza Pro","Noto Sans Arabic",Tahoma,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--font);color:var(--moon);overflow:hidden;
    background:radial-gradient(120% 90% at 50% 0%,var(--dusk) 0%,var(--night) 70%);
  }
  #bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  #bg{z-index:0}
  #fx{z-index:40}

  /* ================= lock screen ================= */
  #lock{
    position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top) + 12dvh) 20px 20px;
    background:rgba(7,12,34,.25);
    transition:transform 1s cubic-bezier(.7,0,.2,1);
  }
  #lock.open{transform:translateY(-110%)}
  #clock{font-size:clamp(84px,26vw,120px);font-weight:200;letter-spacing:2px;line-height:1;text-shadow:0 0 50px rgba(242,179,94,.35)}
  #dateline{margin-top:10px;font-size:19px;color:var(--mist)}

  .notif{
    margin-top:9dvh;width:min(94vw,460px);padding:16px 18px;
    display:flex;align-items:center;gap:14px;cursor:pointer;
    background:rgba(238,242,255,.13);border:1px solid rgba(238,242,255,.22);
    border-radius:28px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 20px 50px -20px rgba(0,0,0,.7);
    animation:notifIn 1.1s cubic-bezier(.2,1.4,.4,1) .5s both,wobble 4.5s ease-in-out 2.5s infinite;
    text-align:start;color:inherit;font-family:inherit;
  }
  .notif:active{transform:scale(.96)}
  .notif:focus-visible,.chip:focus-visible,.dbl:focus-visible{outline:2px solid var(--moon);outline-offset:3px}
  @keyframes notifIn{from{opacity:0;transform:translateY(-60px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes wobble{
    0%,88%,100%{transform:none}
    90%{transform:rotate(-2deg) translateX(-3px)}
    92%{transform:rotate(2deg) translateX(3px)}
    94%{transform:rotate(-1.5deg)}
    96%{transform:rotate(1deg)}
  }
  .avatar{
    flex:none;width:54px;height:54px;border-radius:50%;
    display:grid;place-items:center;font-size:26px;font-weight:700;color:var(--night);
    background:linear-gradient(135deg,#ffd58f,var(--amber) 55%,#ee9b45);
    box-shadow:0 0 0 3px rgba(242,179,94,.25);
  }
  .notif .tx{flex:1;min-width:0}
  .notif b{display:block;font-size:20px;margin-bottom:2px}
  .notif span{font-size:19px;line-height:1.7;color:var(--moon)}
  .notif time{flex:none;align-self:flex-start;font-size:14px;color:var(--mist)}
  #tapHint{margin-top:26px;font-size:18px;color:var(--mist);animation:hint 2.4s ease-in-out infinite}
  @keyframes hint{50%{opacity:.35;transform:translateY(5px)}}

  /* ================= chat ================= */
  #chat{
    position:relative;z-index:1;height:100dvh;
    display:flex;flex-direction:column;
    opacity:0;transition:opacity .8s ease .3s;
  }
  #chat.on{opacity:1}
  header{
    flex:none;display:flex;align-items:center;gap:14px;
    padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
    background:rgba(7,12,34,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(159,176,230,.18);
  }
  header .avatar{width:48px;height:48px;font-size:23px}
  header h1{font-size:21px;font-weight:700;line-height:1.3}
  #status{display:flex;align-items:center;gap:7px;font-size:15px;color:var(--mist);min-height:22px}
  #status i{width:9px;height:9px;border-radius:50%;background:#6ee7a0;box-shadow:0 0 8px #6ee7a0}
  #status.typing i{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.3}}

  #msgs{
    flex:1;overflow-y:auto;overscroll-behavior:contain;
    padding:16px 16px 24px;scroll-behavior:smooth;
  }
  .note{text-align:center;color:var(--mist);font-size:16px;line-height:1.9;margin:6px auto 18px;max-width:20em;opacity:.9}
  .row{display:flex;margin:8px 0 10px}
  .row.in{justify-content:flex-start}
  .row.out{justify-content:flex-end}
  .row.has-react{margin-bottom:20px}
  .bubble{
    position:relative;max-width:82%;padding:13px 19px 9px;
    font-size:21px;line-height:1.95;word-break:break-word;
    animation:pop .5s cubic-bezier(.2,1.5,.4,1) both;user-select:none;-webkit-user-select:none;
  }
  .in .bubble{
    background:rgba(29,49,112,.78);border:1px solid rgba(159,176,230,.25);
    border-radius:24px 24px 6px 24px;transform-origin:100% 100%;
  }
  .out .bubble{
    background:linear-gradient(135deg,#ffd58f,var(--amber) 60%,#ee9b45);color:#1a1205;font-weight:500;
    border-radius:24px 24px 24px 6px;transform-origin:0 100%;
  }
  .bubble time{display:block;margin-top:2px;font-size:12.5px;opacity:.6;text-align:end}
  @keyframes pop{from{opacity:0;transform:scale(.6) translateY(14px)}to{opacity:1;transform:none}}

  .react{
    position:absolute;bottom:-15px;inset-inline-end:12px;
    font-size:19px;line-height:1;padding:3px 8px;border-radius:999px;
    background:var(--night);border:1px solid var(--rose);box-shadow:0 0 14px rgba(255,159,181,.55);
    animation:pop .5s cubic-bezier(.2,1.8,.4,1) both;
  }

  .typing{display:flex;gap:6px;padding:17px 20px !important}
  .typing span{width:9px;height:9px;border-radius:50%;background:var(--mist);animation:bounce 1.1s ease-in-out infinite}
  .typing span:nth-child(2){animation-delay:.15s}
  .typing span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-7px);opacity:1}}

  .card h2{font-size:22px;margin-bottom:8px;color:var(--amber)}
  .card ol{padding-inline-start:26px;font-size:21px;line-height:2.1}
  .card li{margin-bottom:2px}
  .card li::marker{color:var(--rose);font-weight:700}

  /* ================= choices ================= */
  #dock{
    flex:none;min-height:108px;padding:14px 16px calc(env(safe-area-inset-bottom) + 18px);
    display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;
    background:linear-gradient(to top,rgba(7,12,34,.95) 55%,rgba(7,12,34,0));
  }
  .chip{
    position:relative;overflow:hidden;isolation:isolate;cursor:pointer;
    font-family:inherit;font-size:21px;font-weight:600;color:var(--moon);
    padding:15px 28px;border-radius:999px;
    background:rgba(242,179,94,.14);border:1.5px solid var(--amber);
    box-shadow:0 0 0 0 rgba(242,179,94,.45);
    transition:transform .3s cubic-bezier(.3,1.7,.5,1),background .2s;
    animation:chipIn .6s cubic-bezier(.2,1.5,.4,1) both,glowring 2.6s ease-in-out 1s infinite;
  }
  .chip:nth-child(2){animation-delay:.12s,1.2s}
  .chip::after{
    content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
    background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
    transform:translateX(-130%);animation:shine 3.2s ease-in-out 1.2s infinite;
  }
  .chip:hover{transform:translateY(-3px) scale(1.05);background:rgba(242,179,94,.26)}
  .chip:active{transform:scale(.9)}
  .chip.picked{animation:none;background:var(--amber);color:var(--night)}
  .chip.quiet{border-color:rgba(238,242,255,.4);background:rgba(238,242,255,.07);font-size:18px;padding:12px 24px}
  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);pointer-events:none;z-index:0}
  @keyframes chipIn{from{opacity:0;transform:translateY(40px) scale(.7)}to{opacity:1;transform:none}}
  @keyframes glowring{50%{box-shadow:0 0 0 12px rgba(242,179,94,0)}}
  @keyframes shine{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}

  .fh{position:fixed;z-index:50;pointer-events:none;font-size:30px;line-height:1;filter:drop-shadow(0 0 8px rgba(255,159,181,.8))}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}
  }
</style>
</head>
<body>

<!-- =====================================================
     همه‌ی متن‌های گفتگو اینجاست. فقط همینا رو عوض کن.
     a      = پیام امیر
     card   = یه کارت لیستی
     choices= دکمه‌هایی که نگین می‌زنه (جوابش)
     confetti = بارون قلب و برگ
     ===================================================== -->
<script>
const CONFIG = {
  hisName: "امیر",
  hisInitial: "ا",
  lockMessage: "نگین؟ یه چیزی برات دارم",
  script: [
    { a: "سلام کیوتچه" },
    { a: "می‌دونی از کی عاشق چت کردن شدم؟" },
    { choices: ["از کی؟", "نمی‌دونم"] },
    { a: "از وقتی با تو شروع کردم" },
    { a: "یه پاییز بود، یه پیام ساده، بعدشم دیگه نشد حرف زدن باهاتو ول کنم" },
    { a: "الانم بهترین قسمت روزم اینه که گوشیمو برمی‌دارم و می‌بینم تو اونجایی" },
    { choices: ["اوه چه قشنگ", "منم همین‌طور"] },
    { a: "راستی یه لیست درست کردم" },
    { card: { title: "۳ تا چیزی که از تو یاد گرفتم", items: [
        "دوست داشتن یعنی چی",
        "فاصله فقط یه عدده",
        "پاییزم می‌تونه گرم باشه"
    ] } },
    { choices: ["قشنگ بود", "داری گریم می‌ندازی"] },
    { a: "یه چیز دیگه هم هست" },
    { a: "دوستت دارم نگین، خیلی بیشتر از اونی که تو یه پیام جا بشه" },
    { choices: ["منم دوستت دارم", "منم خیلی"] },
    { confetti: true },
    { a: "یه سؤال دارم ازت" },
    { a: "قبول می‌کنی تا همیشه باهم چت کنیم؟" },
    { choices: ["آره", "معلومه که آره"] },
    { confetti: true },
    { a: "پس قول می‌دم تا آخرش جوابتو بدم، حتی نصفه‌شب" },
    { a: "دوستت دارم کیوتچه" },
    { end: true }
  ]
};
</script>

<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<section id="lock">
  <div id="clock"></div>
  <div id="dateline">یه پیام جدید داری</div>
  <button class="notif" id="notif" aria-label="باز کردن پیام">
    <div class="avatar" id="notifAv"></div>
    <div class="tx"><b id="notifName"></b><span id="notifBody"></span></div>
    <time>الان</time>
  </button>
  <div id="tapHint">برای باز کردن، پیام رو لمس کن</div>
</section>

<main id="chat">
  <header>
    <div class="avatar" id="hdAv"></div>
    <div>
      <h1 id="hdName"></h1>
      <div id="status"><i></i><span id="statusTx">آنلاین</span></div>
    </div>
  </header>
  <div id="msgs" aria-live="polite">
    <div class="note">هر پیامی که خوشت اومد، دوبار بزنش تا قلب بخوره</div>
  </div>
  <div id="dock"></div>
</main>

<script>
(function(){
  const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const $ = id => document.getElementById(id);
  const vib = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };
  const timeStr = () => { const d = new Date(); return fa(String(d.getHours()).padStart(2,'0')) + ':' + fa(String(d.getMinutes()).padStart(2,'0')); };

  /* ---------- fill static bits ---------- */
  $('notifAv').textContent = CONFIG.hisInitial;
  $('hdAv').textContent = CONFIG.hisInitial;
  $('notifName').textContent = CONFIG.hisName;
  $('hdName').textContent = CONFIG.hisName;
  $('notifBody').textContent = CONFIG.lockMessage;
  const tickClock = () => $('clock').textContent = timeStr();
  tickClock(); setInterval(tickClock, 15000);

  /* ---------- chat helpers ---------- */
  const msgs = $('msgs'), dock = $('dock');
  const scrollDown = () => msgs.scrollTo({ top: msgs.scrollHeight, behavior: 'smooth' });
  const setStatus = typing => {
    $('status').classList.toggle('typing', typing);
    $('statusTx').textContent = typing ? 'در حال تایپ' : 'آنلاین';
  };

  function addRow(kind, bubbleHTML, extraClass){
    const row = document.createElement('div');
    row.className = 'row ' + kind;
    const b = document.createElement('div');
    b.className = 'bubble dbl' + (extraClass ? ' ' + extraClass : '');
    b.tabIndex = 0;
    b.innerHTML = bubbleHTML;
    row.appendChild(b);
    msgs.appendChild(row);
    scrollDown();
    return { row, b };
  }

  const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const textBubble = (kind, text) => addRow(kind, esc(text) + '<time>' + timeStr() + '</time>');

  async function amirSays(text){
    setStatus(true);
    const t = addRow('in', '<span></span><span></span><span></span>', 'typing');
    await sleep(Math.min(2300, 650 + text.length * 30));
    t.row.remove();
    setStatus(false);
    textBubble('in', text);
    vib(12);
    await sleep(500);
  }

  async function amirCard(c){
    setStatus(true);
    const t = addRow('in', '<span></span><span></span><span></span>', 'typing');
    await sleep(1500);
    t.row.remove(); setStatus(false);
    const items = c.items.map(x => '<li>' + esc(x) + '</li>').join('');
    addRow('in', '<h2>' + esc(c.title) + '</h2><ol>' + items + '</ol><time>' + timeStr() + '</time>', 'card');
    vib(12);
    await sleep(900);
  }

  function choose(options){
    return new Promise(resolve => {
      dock.innerHTML = '';
      options.forEach(text => {
        const c = document.createElement('button');
        c.className = 'chip';
        c.textContent = text;
        c.addEventListener('click', () => {
          c.classList.add('picked');
          vib(18);
          // keep the picked chip visible for a beat, then send it
          setTimeout(() => { dock.innerHTML = ''; textBubble('out', text); resolve(); }, 260);
          dock.querySelectorAll('.chip').forEach(x => { if(x !== c) x.style.visibility = 'hidden'; });
        }, { once: true });
        dock.appendChild(c);
      });
    }).then(() => sleep(650));
  }

  /* ---------- double-tap to heart ---------- */
  let lastTap = 0, lastEl = null;
  function floatHeart(x, y){
    const h = document.createElement('span');
    h.className = 'fh'; h.textContent = '\u2764\uFE0F';
    h.style.left = (x - 15) + 'px'; h.style.top = (y - 15) + 'px';
    document.body.appendChild(h);
    h.animate([{opacity:1, transform:'translateY(0) scale(.5)'},
               {opacity:1, transform:'translateY(-50px) scale(1.5)', offset:.3},
               {opacity:0, transform:'translateY(-150px) scale(1)'}],
              {duration:1100, easing:'ease-out'}).onfinish = () => h.remove();
  }
  msgs.addEventListener('click', e => {
    const b = e.target.closest('.bubble');
    if(!b || b.classList.contains('typing')) return;
    const now = Date.now();
    if(lastEl === b && now - lastTap < 340){
      let r = b.querySelector('.react');
      if(r){ r.remove(); b.parentElement.classList.remove('has-react'); }
      else {
        r = document.createElement('span'); r.className = 'react'; r.textContent = '\u2764\uFE0F';
        b.appendChild(r); b.parentElement.classList.add('has-react');
        floatHeart(e.clientX, e.clientY); vib(20);
      }
      lastEl = null;
    } else { lastEl = b; lastTap = now; }
  });

  /* ---------- button ripple ---------- */
  document.addEventListener('pointerdown', e => {
    const btn = e.target.closest('.chip');
    if(!btn) return;
    const r = btn.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2;
    const sp = document.createElement('span');
    sp.className = 'ripple';
    sp.style.cssText = 'width:' + d + 'px;height:' + d + 'px;left:' + (e.clientX - r.left - d/2) + 'px;top:' + (e.clientY - r.top - d/2) + 'px';
    btn.appendChild(sp);
    sp.animate([{transform:'scale(0)',opacity:.8},{transform:'scale(1)',opacity:0}],
               {duration:650, easing:'ease-out'}).onfinish = () => sp.remove();
  });

  /* ---------- the story ---------- */
  async function play(){
    for(const s of CONFIG.script){
      if(s.a) await amirSays(s.a);
      else if(s.card) await amirCard(s.card);
      else if(s.choices) await choose(s.choices);
      else if(s.confetti){ confetti(); vib([30,60,30]); await sleep(1100); }
      else if(s.end){
        const q = document.createElement('button');
        q.className = 'chip quiet'; q.textContent = 'از اول بخونمش';
        q.addEventListener('click', () => location.reload());
        dock.innerHTML = ''; dock.appendChild(q);
      }
    }
  }

  let started = false;
  $('notif').addEventListener('click', () => {
    if(started) return; started = true;
    vib(25);
    $('lock').classList.add('open');
    $('chat').classList.add('on');
    setTimeout(play, 1100);
  });

  /* ---------- background: drifting autumn leaves ---------- */
  const bg = $('bg'), bctx = bg.getContext('2d');
  const fx = $('fx'), fctx = fx.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, DPR, stars = [], leaves = [], parts = [];

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = bg.clientWidth; H = bg.clientHeight;
    [bg, fx].forEach(c => { c.width = W * DPR; c.height = H * DPR; });
    bctx.setTransform(DPR,0,0,DPR,0,0); fctx.setTransform(DPR,0,0,DPR,0,0);
    stars = Array.from({length: 70}, () => ({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.1+.25, ph:Math.random()*6.28, sp:.4+Math.random()*1.2}));
    const cols = ['#f2b35e','#e08a3c','#c9553d','#f7cf8a'];
    leaves = Array.from({length: 11}, () => mkLeaf(Math.random()*H, cols));
  }
  function mkLeaf(y, cols){
    cols = cols || ['#f2b35e','#e08a3c','#c9553d','#f7cf8a'];
    return {x:Math.random()*W, y, s:6+Math.random()*7, vy:12+Math.random()*16,
            sw:Math.random()*6.28, swS:.4+Math.random()*.6, amp:14+Math.random()*22,
            rot:Math.random()*6.28, vr:(Math.random()-.5)*.8, c:cols[(Math.random()*cols.length)|0]};
  }
  function drawLeaf(ctx, l, alpha){
    const s = l.s;
    ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.rot);
    ctx.globalAlpha = alpha; ctx.fillStyle = l.c;
    ctx.beginPath(); ctx.moveTo(0,-s);
    ctx.quadraticCurveTo(s*.85,-s*.15,0,s);
    ctx.quadraticCurveTo(-s*.85,-s*.15,0,-s); ctx.fill();
    ctx.globalAlpha = alpha * .6; ctx.strokeStyle = '#2a1405'; ctx.lineWidth = .7;
    ctx.beginPath(); ctx.moveTo(0,-s*.8); ctx.lineTo(0,s*1.15); ctx.stroke();
    ctx.restore();
  }

  function confetti(){
    const cols = ['#ff9fb5','#f2b35e','#ffd58f','#ffffff','#9fb0e6'];
    for(let i = 0; i < 90; i++){
      const heart = Math.random() < .6;
      parts.push({
        x: Math.random() * W, y: -20 - Math.random() * H * .5,
        vx: (Math.random() - .5) * 60, vy: 90 + Math.random() * 160,
        rot: Math.random() * 6.28, vr: (Math.random() - .5) * 4,
        s: heart ? 14 + Math.random() * 16 : 8 + Math.random() * 8,
        c: heart ? cols[(Math.random()*3)|0] : ['#f2b35e','#e08a3c','#c9553d'][(Math.random()*3)|0],
        heart
      });
    }
  }

  let last = performance.now();
  function frame(now){
    const dt = Math.min((now - last)/1000, .05); last = now;
    bctx.clearRect(0,0,W,H);
    for(const s of stars){
      bctx.globalAlpha = reduce ? .6 : .3 + .5*Math.abs(Math.sin(now/1000*s.sp + s.ph));
      bctx.fillStyle = '#eef2ff';
      bctx.beginPath(); bctx.arc(s.x, s.y, s.r, 0, 6.283); bctx.fill();
    }
    for(const l of leaves){
      if(!reduce){
        l.y += l.vy*dt; l.sw += l.swS*dt; l.rot += l.vr*dt; l.x += Math.sin(l.sw)*l.amp*dt;
        if(l.y > H + 20){ l.y = -20; l.x = Math.random()*W; }
        if(l.x < -20) l.x = W + 20; if(l.x > W + 20) l.x = -20;
      }
      drawLeaf(bctx, l, .4);
